# RoadSentinel local stack. From the repository root:
#
#   python scripts/gen_dev_secrets.py
#   docker compose --env-file .env -f deploy/docker-compose.yml up --build
#
# Then open https://localhost (Caddy's local CA; accept or trust the dev certificate).
name: roadsentinel

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-db-urls:
  app_url: &app_url postgresql+psycopg://rs_app:${RS_APP_DB_PASSWORD:?run scripts/gen_dev_secrets.py}@postgres:5432/roadsentinel

x-app-env: &app_env
  RS_ENV: ${RS_ENV:-dev}
  RS_DEBUG: ${RS_DEBUG:-false}
  RS_CORS_ORIGINS: ${RS_CORS_ORIGINS:-}
  RS_DATABASE_URL: *app_url
  RS_PUBLIC_ORIGIN: ${RS_PUBLIC_ORIGIN:-https://localhost}
  RS_COOKIE_SECURE: ${RS_COOKIE_SECURE:-true}
  RS_TRUST_PROXY: ${RS_TRUST_PROXY:-true}
  RS_JWT_SECRET: ${RS_JWT_SECRET:?}
  RS_URL_SIGNING_KEY: ${RS_URL_SIGNING_KEY:?}
  RS_MASTER_KEYS: ${RS_MASTER_KEYS:?}
  RS_MASTER_KEY_CURRENT: ${RS_MASTER_KEY_CURRENT:-1}
  RS_VAPID_PUBLIC_KEY: ${RS_VAPID_PUBLIC_KEY:-}
  RS_VAPID_PRIVATE_KEY: ${RS_VAPID_PRIVATE_KEY:-}
  RS_VAPID_SUBJECT: ${RS_VAPID_SUBJECT:-mailto:security@roadsentinel.invalid}
  RS_SEED_PASSWORD: ${RS_SEED_PASSWORD:-}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [db]

  # One-shot: create roles/database (superuser) and run migrations (owner role).
  migrate:
    build: &backend_build
      context: ..
      dockerfile: backend/Dockerfile
    image: roadsentinel-backend:dev
    command: ["sh", "-c", "python -m app.cli bootstrap-db && python -m app.cli migrate"]
    environment:
      <<: *app_env
      RS_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      RS_MIGRATOR_DATABASE_URL: postgresql+psycopg://rs_owner:${RS_OWNER_DB_PASSWORD:?}@postgres:5432/roadsentinel
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    networks: [db]

  backend:
    build: *backend_build
    image: roadsentinel-backend:dev
    environment: *app_env
    volumes:
      - evidence:/data/evidence
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    <<: *hardening
    networks: [db, web]

  frontend:
    build:
      context: ../secure-pwa
    image: roadsentinel-frontend:dev
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *hardening
    networks: [web]

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      RS_SITE_ADDRESS: ${RS_SITE_ADDRESS:-localhost}
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

networks:
  db:
    internal: true  # PostgreSQL is never reachable from outside the stack
  web: {}

volumes:
  pgdata: {}
  evidence: {}
  caddy_data: {}
  caddy_config: {}
